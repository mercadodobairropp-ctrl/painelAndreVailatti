<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Painel Operacional</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="loginBox">
    <div class="center">
        <img src="icon-512.png" class="logo" style="width:96px;height:96px;border-radius:22px">
        <h1>🔐 Painel Operacional</h1>
        <div class="sub">Confiança Supermercados</div>
    </div>
    <input id="login" placeholder="Login" inputmode="numeric">
    <input id="senha" placeholder="Senha" type="password" inputmode="numeric">
    <button onclick="entrar()">Entrar</button>
    <p id="erro" style="color:#ef4444;font-weight:bold"></p>
</div>

<script src="config.js"></script>
<script>
function carregarUsuarios(){
    const salvos = localStorage.getItem("usuariosSistema");
    if(salvos) return JSON.parse(salvos);
    localStorage.setItem("usuariosSistema", JSON.stringify(APP.usuariosPadrao));
    return APP.usuariosPadrao;
}
function entrar(){
    const login = document.getElementById("login").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const usuarios = carregarUsuarios();
    const u = usuarios.find(x => x.login === login && x.senha === senha);
    if(!u){
        document.getElementById("erro").innerText = "Login ou senha inválidos.";
        return;
    }
    localStorage.setItem("usuarioLogado", JSON.stringify(u));
    window.location.href = "painel.html";
}
</script>
</body>
</html>
