<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Painel Operacional</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css?v=6.10-loginfix-20260615"></head><body>
<div class="loginBox"><div class="center"><img src="icon-512.png" class="logo" style="width:96px;height:96px;border-radius:22px"><h1>Painel Operacional</h1><div class="sub">Confiança Supermercados • v6.10</div></div><input id="login" placeholder="Login" inputmode="numeric"><input id="senha" placeholder="Senha" type="password" inputmode="numeric"><button onclick="entrar()">Entrar</button><a class="btn secondary" href="monitor.html">Abrir monitor de alertas</a><p id="status" class="small">Usuários sincronizados com Google Sheets.<br>Desenvolvido por Andre Vailatti.</p><p id="erro" style="color:#ef4444;font-weight:bold"></p></div>
<script src="config.js?v=6.10-loginfix-20260615"></script><script src="app.js?v=6.10-loginfix-20260615"></script><script>
async function entrar(){const l=login.value.trim(),s=normalizarSenha(senha.value);erro.innerText="";status.innerText="Conferindo login...";try{await testarConexaoLogin();const us=await carregarUsuariosOnline(true);const loginNormalizado=normalizarLogin(l);const u=us.find(x=>normalizarLogin(x.login)===loginNormalizado&&normalizarSenha(x.senha)===s);if(!u){erro.innerText="Login ou senha inválidos.";status.innerText="Tente novamente.";return}localStorage.setItem("usuarioLogado",JSON.stringify(normalizarUsuario(u)));localStorage.removeItem("turnoSelecionado");marcarSync();location.href="painel.html"}catch(e){const us=JSON.parse(localStorage.getItem("usuariosSistema")||"[]");const loginNormalizado=normalizarLogin(l);const u=us.find(x=>normalizarLogin(x.login)===loginNormalizado&&normalizarSenha(x.senha)===s);if(u){localStorage.setItem("usuarioLogado",JSON.stringify(normalizarUsuario(u)));localStorage.removeItem("turnoSelecionado");location.href="painel.html";return}erro.innerText="Erro ao buscar usuários online.";status.innerHTML=`${e.message||"Falha ao conectar ao Google Script."}<br><a target="_blank" href="${APP.API_URL}?acao=getUsers">Testar conexão com a base</a>`}}
function testarConexaoLogin(){return Promise.race([carregarSyncInfo().then(r=>{if(!r||r.status!=="ok")throw new Error("A base online não respondeu corretamente.");return r}),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Tempo esgotado ao conectar com a base online.")),12000))])}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
