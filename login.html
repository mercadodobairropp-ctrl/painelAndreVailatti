<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Painel Operacional</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"></head><body>
<div class="loginBox"><div class="center"><img src="icon-512.png" class="logo" style="width:96px;height:96px;border-radius:22px"><h1>🔐 Painel Operacional</h1><div class="sub">Confiança Supermercados • v5.6</div></div><input id="login" placeholder="Login" inputmode="numeric"><input id="senha" placeholder="Senha" type="password" inputmode="numeric"><button onclick="entrar()">Entrar</button><a class="btn secondary" href="monitor.html">📺 Abrir monitor de alertas</a><p id="status" class="small">Usuários sincronizados com Google Sheets.</p><p id="erro" style="color:#ef4444;font-weight:bold"></p></div>
<script src="config.js"></script><script src="app.js"></script><script>
async function entrar(){const l=login.value.trim(),s=senha.value.trim();erro.innerText="";status.innerText="Conferindo login...";try{const us=await carregarUsuariosOnline(true);const loginNormalizado=normalizarLogin(l);const u=us.find(x=>normalizarLogin(x.login)===loginNormalizado&&String(x.senha)===s);if(!u){erro.innerText="Login ou senha inválidos.";status.innerText="Tente novamente.";return}localStorage.setItem("usuarioLogado",JSON.stringify(normalizarUsuario(u)));marcarSync();location.href="painel.html"}catch(e){erro.innerText="Erro ao buscar usuários online.";status.innerText=e.message}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
