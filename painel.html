<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Operacional</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div style="padding:20px;">

<h1 id="titulo"></h1>

<button onclick="logout()">
Sair
</button>

<div id="adminArea"></div>

<h2>📋 Checklists</h2>

<div id="lista"></div>

</div>

<script src="usuarios.js"></script>

<script>

const usuario =
    JSON.parse(
        localStorage.getItem(
            "usuarioLogado"
        )
    );

if(!usuario){

    window.location.href =
        "login.html";

}

document.getElementById("titulo").innerText =
    "Olá " + usuario.nome;

function logout(){

    localStorage.removeItem(
        "usuarioLogado"
    );

    window.location.href =
        "login.html";

}

const checklists = [

{
    nome:"Checklist Fechamento",
    horario:"21:00",
    arquivo:"checklists/fechamento.html"
},

{
    nome:"Checklist Padaria",
    horario:"09:00",
    arquivo:"checklists/padaria.html"
},

{
    nome:"Checklist Açougue",
    horario:"14:00",
    arquivo:"checklists/acougue.html"
}

];

const lista =
    document.getElementById("lista");

checklists.forEach(c => {

    const item =
        document.createElement("div");

    item.style.background = "#1f2937";

    item.style.padding = "15px";

    item.style.marginBottom = "10px";

    item.style.borderRadius = "10px";

    item.innerHTML = `

        <h3>${c.nome}</h3>

        <p>Horário: ${c.horario}</p>

        <button onclick="abrirChecklist('${c.arquivo}')">
        Abrir
        </button>

    `;

    lista.appendChild(item);

});

function abrirChecklist(url){

    localStorage.setItem(
        "checklistEmExecucao",
        url
    );

    window.location.href = url;

}

if(usuario.tipo === "admin"){

    document.getElementById("adminArea").innerHTML = `

        <h2>🛠 Painel Gerencial</h2>

        <button>
        Relatórios
        </button>

        <button>
        Usuários
        </button>

    `;

}

</script>

</body>
</html>
