<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Operacional</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="topbar">
        <div class="logoArea">
            <img src="icon-512.png" class="logo">
            <div>
                <h1 id="titulo">Painel</h1>
                <div class="sub">Sistema de checklists operacionais</div>
            </div>
        </div>
        <button class="secondary" style="width:auto;margin:0" onclick="logout()">Sair</button>
    </div>

    <div id="adminArea" class="adminPanel card"></div>

    <div class="card">
        <h2>🕒 Selecionar turno</h2>
        <select id="turnoSelecionado" onchange="salvarTurno()">
            <option value="">Escolha o turno</option>
        </select>
        <div class="small">O turno define quais checklists aparecem. O login registra quem executou.</div>
    </div>

    <div class="card">
        <h2>🚨 Pendências</h2>
        <div id="pendencias">Selecione um turno.</div>
    </div>

    <div id="lista"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const usuario = exigirLogin();
let checklistsCarregados = [];

document.getElementById("titulo").innerText = `Olá, ${usuario.nome}`;

function logout(){
    localStorage.removeItem("usuarioLogado");
    localStorage.removeItem("turnoSelecionado");
    window.location.href = "login.html";
}

function carregarTurnos(){
    const sel = document.getElementById("turnoSelecionado");
    APP.turnos.forEach(t=>{
        const op = document.createElement("option");
        op.value = t.id; op.innerText = t.nome;
        sel.appendChild(op);
    });
    sel.value = localStorage.getItem("turnoSelecionado") || "";
}

function salvarTurno(){
    localStorage.setItem("turnoSelecionado", document.getElementById("turnoSelecionado").value);
    renderizarPainel();
}

function renderizarAdmin(){
    if(usuario.tipo !== "admin") return;
    const area = document.getElementById("adminArea");
    area.style.display = "block";
    area.innerHTML = `
        <h2>🛠 Painel Gerencial</h2>
        <div class="grid">
            <button onclick="mostrarUsuarios()">👥 Usuários</button>
            <button onclick="mostrarRelatorio()">📊 Relatório local</button>
            <button onclick="mostrarTodos()">👁️ Visualizar todos os checklists</button>
            <button onclick="sincronizarTudo()">🔄 Sincronizar planilha</button>
        </div>
        <div id="adminConteudo"></div>
    `;
}
async function sincronizarTudo(){
    try{
        await carregarUsuariosOnline();
        checklistsCarregados = await obterChecklists();
        alert("Usuários e checklists sincronizados com a planilha.");
        renderizarPainel();
    }catch(e){
        alert("Erro ao sincronizar: " + e.message);
    }
}
function getUsuariosCache(){
    const s = localStorage.getItem("usuariosSistema");
    return s ? JSON.parse(s) : [];
}
async function mostrarUsuarios(){
    const conteudo = document.getElementById("adminConteudo");
    conteudo.innerHTML = `<h3>Carregando usuários...</h3>`;
    try{ await carregarUsuariosOnline(); }catch(e){}
    conteudo.innerHTML = `
        <h3>Cadastro de usuários global</h3>
        <div class="small">Salva na planilha Google Sheets e passa a valer em todos os aparelhos.</div>
        <input id="uLogin" placeholder="Login">
        <input id="uNome" placeholder="Nome">
        <input id="uSenha" placeholder="Senha">
        <select id="uTipo"><option value="operador">Operador</option><option value="admin">Administrador</option></select>
        <button onclick="salvarUsuarioAdmin()">Salvar usuário</button>
        <div id="listaUsuarios"></div>
    `;
    listarUsuariosAdmin();
}
async function salvarUsuarioAdmin(){
    const u = {
        login:document.getElementById("uLogin").value.trim(),
        nome:document.getElementById("uNome").value.trim(),
        senha:document.getElementById("uSenha").value.trim(),
        tipo:document.getElementById("uTipo").value
    };
    if(!u.login || !u.nome || !u.senha){ alert("Preencha login, nome e senha."); return; }
    await salvarUsuarioOnline(u);
    alert("Usuário salvo globalmente na planilha.");
    listarUsuariosAdmin();
}
function listarUsuariosAdmin(){
    const div = document.getElementById("listaUsuarios");
    div.innerHTML = "";
    getUsuariosCache().forEach(u=>{
        div.innerHTML += `<div class="tableItem"><b>${u.nome}</b><br>Login: ${u.login}<br>Tipo: ${u.tipo}</div>`;
    });
}
function mostrarRelatorio(){
    const div = document.getElementById("adminConteudo");
    const historico = JSON.parse(localStorage.getItem("historicoLocal") || "[]");
    let html = `<h3>Relatório local</h3><div class="small">Este relatório mostra as execuções registradas neste aparelho.</div>`;
    if(!historico.length) html += `<p>Nenhuma execução registrada neste aparelho.</p>`;
    historico.slice().reverse().forEach(h=>{
        html += `<div class="tableItem"><b>${h.checklist}</b><br>Usuário: ${h.nome} (${h.login})<br>Data: ${h.data} ${h.hora}<br>Arquivo: ${h.arquivo}</div>`;
    });
    div.innerHTML = html;
}
function mostrarTodos(){
    localStorage.setItem("turnoSelecionado","gerencial");
    document.getElementById("turnoSelecionado").value = "gerencial";
    renderizarPainel(true);
}

async function renderizarPainel(forcarTodos=false){
    const lista = document.getElementById("lista");
    const pend = document.getElementById("pendencias");
    lista.innerHTML = "";
    const turno = localStorage.getItem("turnoSelecionado");
    document.getElementById("turnoSelecionado").value = turno || "";
    if(!turno){ lista.innerHTML = `<div class="card gray">Selecione um turno.</div>`; return; }

    if(!checklistsCarregados.length){
        lista.innerHTML = `<div class="card yellow">Carregando checklists da planilha...</div>`;
        checklistsCarregados = await obterChecklists();
    }

    const minutos = agoraMinutos();
    const dia = diaSemanaAtual();

    const visiveis = checklistsCarregados.filter(c=>{
        const ativoHoje = !c.dias.length || c.dias.includes(dia);
        if(!ativoHoje) return false;
        if(usuario.tipo==="admin" && (turno==="gerencial" || forcarTodos)) return true;
        return c.turnos.includes(turno);
    });

    let pendencias = [];

    if(!visiveis.length){
        lista.innerHTML = `<div class="card gray">Nenhum checklist configurado para este turno/dia.</div>`;
        pend.innerHTML = "✅ Nenhuma pendência para este turno.";
        return;
    }

    visiveis.forEach(c=>{
        const st = getLocalState(c.id);
        const horario = horarioParaMinutos(c.horario);
        const atraso = minutos - horario;
        let classe="yellow", status="", bloqueado=false;
        if(st.concluido){
            const d = JSON.parse(st.concluido);
            classe="green"; bloqueado=true;
            status = `✅ Finalizado por ${d.nome} às ${d.hora}`;
        } else if(st.executando){
            const d = JSON.parse(st.executando);
            if(d.login !== usuario.login){
                classe="gray"; bloqueado=true;
                status = `🔒 Em execução por ${d.nome}`;
            } else {
                classe="green"; status = "🟢 Em execução por você";
            }
            pendencias.push(`${c.nome} — em execução`);
        } else if(atraso < 0){
            const falta = Math.abs(atraso);
            classe="yellow"; bloqueado=true;
            status = `⏳ Libera em ${Math.floor(falta/60)}h ${falta%60}min`;
        } else if(atraso < 30){
            classe="green"; status="🟢 Liberado";
            alertaUnico(c.id,"liberado",1);
            pendencias.push(`${c.nome} — liberado`);
        } else if(atraso < 60){
            classe="red"; status=`🔴 Atrasado há ${atraso} min`;
            alertaUnico(c.id,"atrasado30",2);
            pendencias.push(`${c.nome} — atrasado`);
        } else {
            classe="darkred"; status=`⚫ Crítico há ${atraso} min`;
            alertaUnico(c.id,"critico1h",4,`⚫ CRÍTICO: ${c.nome} está atrasado há ${atraso} minutos. Horário previsto: ${c.horario}.`);
            pendencias.push(`${c.nome} — crítico`);
        }

        lista.innerHTML += `
            <div class="card ${classe}">
                <h2>${c.nome}</h2>
                <div class="sub">${c.descricao}</div>
                <span class="badge ${c.prioridade==='alta'?'red':c.prioridade==='media'?'yellow':'green'}">${c.prioridade.toUpperCase()}</span>
                <span class="badge blue">Horário ${c.horario}</span>
                <span class="badge gray">Dias: ${c.dias.join(", ") || "todos"}</span>
                <p><b>Status:</b> ${status}</p>
                <button ${bloqueado?'disabled':''} onclick="abrirChecklist('${c.id}')">Abrir checklist</button>
            </div>
        `;
    });

    pend.innerHTML = pendencias.length ? pendencias.map(p=>"• "+p).join("<br>") : "✅ Nenhuma pendência para este turno.";
}
function abrirChecklist(id){
    const c = checklistsCarregados.find(x=>x.id===id);
    const st = getLocalState(id);
    if(st.concluido){ alert("Este checklist já foi finalizado hoje."); return; }
    if(st.executando){
        const d = JSON.parse(st.executando);
        if(d.login !== usuario.login){ alert("Este checklist está em execução por "+d.nome); return; }
    }
    setExecutando(id, usuario);
    window.location.href = `checklist.html?id=${encodeURIComponent(id)}`;
}

async function inicializar(){
    carregarTurnos();
    renderizarAdmin();
    try{ checklistsCarregados = await obterChecklists(); }catch(e){}
    renderizarPainel();
}
inicializar();
setInterval(()=>renderizarPainel(), 60000);
</script>
</body>
</html>
