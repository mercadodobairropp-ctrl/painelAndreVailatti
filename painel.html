<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Painel Operacional v3.0</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"></head><body>
<div class="container"><div class="topbar"><div class="logoArea"><img src="icon-512.png" class="logo"><div><h1 id="titulo">Painel</h1><div class="sub">Painel Operacional v3.0</div></div></div><button class="secondary" style="width:auto;margin:0" onclick="logout()">Sair</button></div><div id="adminArea" class="adminPanel card"></div><div class="card"><h2>🕒 Selecionar turno</h2><select id="turnoSelecionado" onchange="salvarTurno()"><option value="">Escolha o turno</option></select><div class="small">Só aparecem turnos com checklist programado para hoje e permitido para seu usuário.</div></div><div class="card"><h2>🚨 Pendências</h2><div id="pendencias">Carregando...</div></div><div id="lista"></div><div class="footerStatus" id="footerStatus">v3.0</div></div>
<script src="config.js"></script><script src="app.js"></script><script>
const usuario=exigirLogin();let checklistsCarregados=[],turnosCarregados=[],execucoes=[],secaoAberta=null;titulo.innerText=`Olá, ${usuario.nome}`;
function logout(){localStorage.removeItem("usuarioLogado");localStorage.removeItem("turnoSelecionado");location.href="login.html";}
function toggleSecao(nome,fn){const a=document.getElementById("adminConteudo");if(secaoAberta===nome){secaoAberta=null;a.innerHTML="";return;}secaoAberta=nome;fn();}
async function carregarDados(){turnosCarregados=await obterTurnos();checklistsCarregados=await obterChecklists();execucoes=await carregarExecucoesOnline(hojeISO(),hojeISO());marcarSync();}
function execOnline(idExec){return execucoes.find(e=>e.idExecucao===idExec);}
function execCombinada(c){const idE=execId(c);return execOnline(idE)||getExecLocal(idE);}
function statusCombinado(c){const ex=execCombinada(c);return{idExec:execId(c),exec:ex,status:statusExecucao(c,ex)};}
function turnosComChecklistHoje(){const dia=diaSemanaAtual(),ids=new Set();checklistsCarregados.forEach(c=>{if(c.ativo==="nao")return;if(c.dias.length&&!c.dias.includes(dia))return;c.turnos.forEach(t=>ids.add(t));});return turnosCarregados.filter(t=>ids.has(t.id)&&usuarioPodeVerTurno(usuario,t.id));}
function renderTurnos(){const sel=turnoSelecionado,atual=localStorage.getItem("turnoSelecionado")||"";sel.innerHTML='<option value="">Escolha o turno</option>';turnosComChecklistHoje().forEach(t=>{const op=document.createElement("option");op.value=t.id;op.innerText=t.nome;sel.appendChild(op);});if([...sel.options].some(o=>o.value===atual))sel.value=atual;else localStorage.removeItem("turnoSelecionado");}
function salvarTurno(){localStorage.setItem("turnoSelecionado",turnoSelecionado.value);renderizarPainel();}
function cardHTML(c,o){const ex=o.exec,st=o.status,idE=o.idExec,classe=classeStatus(st),texto=textoStatus(st,c,ex);const bloqueado=["aguardando","expirado","finalizado","aguardando_envio"].includes(st)||(ex&&ex.status==="executando"&&ex.login!==usuario.login);const pdf=ex?.urlPDF?`<a class="btn blue" target="_blank" href="${ex.urlPDF}">Abrir PDF</a>`:"";const reabrir=(usuario.tipo==="admin"&&["expirado","finalizado"].includes(st))?`<button class="yellow" onclick="reabrirExecucao('${idE}','${c.id}')">Reabrir +1h</button>`:"";return `<div class="card ${classe}"><h2>${c.nome}</h2><div class="sub">${c.descricao}</div><span class="badge ${c.prioridade==='alta'?'red':c.prioridade==='media'?'yellow':'green'}">${c.prioridade.toUpperCase()}</span><span class="badge blue">${c.horario} até ${c.horarioFim}</span><span class="badge gray">Turnos: ${c.turnos.join(", ")}</span>${c.responsaveisPermitidos.length?`<span class="badge black">Responsáveis: ${c.responsaveisPermitidos.join(", ")}</span>`:""}<p><b>Status:</b> ${texto}</p>${pdf}<button ${bloqueado?'disabled':''} onclick="abrirChecklist('${c.id}')">Abrir checklist</button>${reabrir}</div>`;}
async function renderizarPainel(){lista.innerHTML="";const turno=localStorage.getItem("turnoSelecionado");turnoSelecionado.value=turno||"";if(!turno){lista.innerHTML='<div class="card gray">Selecione um turno.</div>';pendencias.innerText="Selecione um turno.";atualizarFooter();return;}const dia=diaSemanaAtual();const vis=checklistsCarregados.filter(c=>c.ativo!=="nao"&&(!c.dias.length||c.dias.includes(dia))&&c.turnos.includes(turno)&&checklistPermitidoUsuario(c,usuario,turno));const cards=vis.map(c=>({checklist:c,...statusCombinado(c)})).sort(ordenarCards);if(!cards.length){lista.innerHTML='<div class="card gray">Nenhum checklist programado para este turno hoje.</div>';pendencias.innerText="✅ Nenhuma pendência.";return;}const ps=[];cards.forEach(o=>{if(["liberado","atrasado","critico","executando","reaberto","aguardando_envio"].includes(o.status))ps.push(`${o.checklist.nome} — ${textoStatus(o.status,o.checklist,o.exec)}`);dispararAlertas(o.checklist,o.idExec,o.status);lista.innerHTML+=cardHTML(o.checklist,o);});pendencias.innerHTML=ps.length?ps.map(p=>"• "+p).join("<br>"):"✅ Nenhuma pendência.";atualizarFooter();}
function dispararAlertas(c,idE,st){if(st==="liberado")alertaUnico(idE,"liberado",1);if(st==="atrasado")alertaUnico(idE,"atrasado30",3);if(st==="critico")alertaUnico(idE,"critico1h",6,`⚫ CRÍTICO: ${c.nome} (${c.horario} até ${c.horarioFim}) está crítico.`);}
function abrirChecklist(id){const c=checklistsCarregados.find(x=>x.id===id),idE=execId(c),ex=execCombinada(c),st=statusExecucao(c,ex);if(["aguardando","expirado","finalizado","aguardando_envio"].includes(st)){alert("Este checklist não está disponível.");return;}if(ex&&ex.status==="executando"&&ex.login!==usuario.login){alert("Está em execução por "+(ex.nomeUsuario||ex.nome));return;}setExecLocal(idE,{idExecucao:idE,status:"executando",login:usuario.login,nomeUsuario:usuario.nome,nome:usuario.nome,inicioISO:new Date().toISOString()});postAPI({acao:"log",tipo:"abriu",login:usuario.login,nomeUsuario:usuario.nome,idChecklist:c.id,nomeChecklist:c.nome,detalhe:"Abriu "+idE});location.href=`checklist.html?id=${encodeURIComponent(id)}&exec=${encodeURIComponent(idE)}`;}
async function reabrirExecucao(idE,idC){if(!confirm("Reabrir esta execução por mais 1 hora?"))return;await postAPI({acao:"reabrirExecucao",idExecucao:idE,idChecklist:idC,login:usuario.login,nomeUsuario:usuario.nome});localStorage.removeItem("exec_"+idE);await carregarDados();renderizarPainel();}
function renderizarAdmin(){if(usuario.tipo!=="admin")return;adminArea.style.display="block";adminArea.innerHTML=`<h2>🛠 Painel Gerencial</h2><div class="grid two"><button onclick="toggleSecao('usuarios',mostrarUsuarios)">👥 Usuários</button><button onclick="toggleSecao('novoChecklist',mostrarNovoChecklist)">➕ Novo checklist</button><button onclick="toggleSecao('existentes',mostrarExistentes)">📋 Checklists existentes</button><button onclick="toggleSecao('relatorio',mostrarRelatorio)">📊 Relatórios</button><button onclick="toggleSecao('todos',mostrarTodos)">👁️ Visualizar todos hoje</button></div><div id="adminConteudo"></div>`;}
async function mostrarUsuarios(){const div=adminConteudo;await carregarUsuariosOnline();const users=JSON.parse(localStorage.getItem("usuariosSistema")||"[]");div.innerHTML=`<h3>👥 Usuários</h3><input id="uLogin" placeholder="Login"><input id="uNome" placeholder="Nome"><input id="uSenha" placeholder="Senha"><input id="uTurnos" placeholder="Turnos permitidos: 1manha,2manha ou vazio para todos"><select id="uTipo"><option value="operador">Operador</option><option value="admin">Admin</option></select><button onclick="salvarUser()">Salvar usuário</button><div id="listaUsers"></div>`;listaUsers.innerHTML=users.map(u=>`<div class="tableItem"><b>${u.nome}</b><br>Login: ${u.login}<br>Tipo: ${u.tipo}<br>Turnos: ${u.turnosPermitidos||"todos permitidos"}</div>`).join("");}
async function salvarUser(){const u={login:uLogin.value.trim(),nome:uNome.value.trim(),senha:uSenha.value.trim(),tipo:uTipo.value,turnosPermitidos:uTurnos.value.trim()};if(!u.login||!u.nome||!u.senha){alert("Preencha login, nome e senha.");return}await salvarUsuarioOnline(u,usuario.login);alert("Usuário salvo globalmente.");mostrarUsuarios();}
function mostrarNovoChecklist(c=null){adminConteudo.innerHTML=`<h3>➕ Novo / editar checklist</h3><input id="cId" placeholder="ID único" value="${c?.id||""}"><input id="cNome" placeholder="Nome" value="${c?.nome||""}"><textarea id="cDesc" placeholder="Descrição">${c?.descricao||""}</textarea><input id="cHorario" placeholder="Horário início HH:MM" value="${c?.horario||""}"><input id="cHorarioFim" placeholder="Horário fim HH:MM" value="${c?.horarioFim||""}"><input id="cTurnos" placeholder="Turnos: 1manha,2tarde" value="${c?.turnos?.join(",")||""}"><input id="cDias" placeholder="Dias: dom,seg,ter,qua,qui,sex,sab" value="${c?.dias?.join(",")||""}"><input id="cResp" placeholder="Responsáveis por login: 04,08 ou vazio" value="${c?.responsaveisPermitidos?.join(",")||""}"><select id="cPrioridade"><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option></select><select id="cAtivo"><option value="sim">Ativo</option><option value="nao">Inativo</option></select><textarea id="cTarefas" placeholder="Uma tarefa por linha">${c?.tarefas?.join("\n")||""}</textarea><button onclick="salvarChecklistAdmin()">Salvar checklist</button>`;if(c){cPrioridade.value=c.prioridade;cAtivo.value=c.ativo||"sim";}}
async function salvarChecklistAdmin(){const payload={acao:"saveChecklist",id:cId.value.trim(),nome:cNome.value.trim(),descricao:cDesc.value.trim(),horario:cHorario.value.trim(),horarioFim:cHorarioFim.value.trim(),turnos:cTurnos.value.trim(),dias:cDias.value.trim(),prioridade:cPrioridade.value,responsaveisPermitidos:cResp.value.trim(),tarefas:cTarefas.value.trim(),ativo:cAtivo.value,login:usuario.login,nomeUsuario:usuario.nome};if(!payload.id||!payload.nome||!payload.horario||!payload.horarioFim){alert("Preencha ID, nome, horário e horário fim.");return}await postAPI(payload);alert("Checklist salvo.");await carregarDados();renderizarPainel();}
function mostrarExistentes(){adminConteudo.innerHTML=`<h3>📋 Checklists existentes</h3>`+checklistsCarregados.map(c=>`<div class="tableItem"><b>${c.nome}</b><br>${c.horario} até ${c.horarioFim}<br>Status: ${c.ativo}<button onclick="toggleAtivo('${c.id}')">${c.ativo==='nao'?'Ativar':'Desativar'}</button><button class="secondary" onclick="editarChecklist('${c.id}')">Editar</button><button class="red" onclick="excluirChecklist('${c.id}')">Excluir</button></div>`).join("");}
function editarChecklist(id){mostrarNovoChecklist(checklistsCarregados.find(c=>c.id===id));}
async function toggleAtivo(id){const c=checklistsCarregados.find(x=>x.id===id);await postAPI({acao:"toggleChecklist",id,ativo:c.ativo==="nao"?"sim":"nao",login:usuario.login,nomeUsuario:usuario.nome});await carregarDados();mostrarExistentes();renderizarPainel();}
async function excluirChecklist(id){const c=checklistsCarregados.find(x=>x.id===id);if(!confirm(`Confirma excluir "${c?.nome||id}"?`))return;await postAPI({acao:"deleteChecklist",id,login:usuario.login,nomeUsuario:usuario.nome});await carregarDados();mostrarExistentes();renderizarPainel();}
function periodo(tipo){const d=new Date(),pad=n=>String(n).padStart(2,"0");if(tipo==="dia"){const s=hojeISO();return{inicio:s,fim:s};}if(tipo==="mes"){const i=`${d.getFullYear()}-${pad(d.getMonth()+1)}-01`;const f=new Date(d.getFullYear(),d.getMonth()+1,0);return{inicio:i,fim:`${f.getFullYear()}-${pad(f.getMonth()+1)}-${pad(f.getDate())}`};}const day=d.getDay(),diff=(day===0?-6:1-day),mon=new Date(d);mon.setDate(d.getDate()+diff);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return{inicio:`${mon.getFullYear()}-${pad(mon.getMonth()+1)}-${pad(mon.getDate())}`,fim:`${sun.getFullYear()}-${pad(sun.getMonth()+1)}-${pad(sun.getDate())}`};}
function mostrarRelatorio(){adminConteudo.innerHTML=`<h3>📊 Relatórios</h3><div class="grid three"><button onclick="gerarRel('dia')">Dia</button><button onclick="gerarRel('semana')">Semana</button><button onclick="gerarRel('mes')">Mês</button></div><div id="relOut"></div>`;}
async function gerarRel(tipo){const p=periodo(tipo);relOut.innerHTML="Carregando...";const ex=await carregarExecucoesOnline(p.inicio,p.fim);relOut.innerHTML=ex.length?ex.map(e=>`<div class="tableItem"><b>${e.nomeChecklist}</b><br>${e.data} • ${e.horario} até ${e.horarioFim}<br>Status: ${e.status}<br>Usuário: ${e.nomeUsuario||"-"}<br>${e.urlPDF?`<a class="btn blue" target="_blank" href="${e.urlPDF}">Abrir PDF</a>`:""}</div>`).join(""):"Nenhum registro.";}
function mostrarTodos(){const dia=diaSemanaAtual();const turnos=[...new Set(checklistsCarregados.filter(c=>!c.dias.length||c.dias.includes(dia)).flatMap(c=>c.turnos))];adminConteudo.innerHTML=`<h3>👁️ Todos os checklists de hoje</h3><select id="filtroTodos" onchange="renderTodos()"><option value="">Todos os turnos</option>${turnos.map(t=>`<option value="${t}">${t}</option>`).join("")}</select><div id="todosOut"></div>`;renderTodos();}
function renderTodos(){const f=filtroTodos.value,dia=diaSemanaAtual();const arr=checklistsCarregados.filter(c=>(!c.dias.length||c.dias.includes(dia))&&(!f||c.turnos.includes(f))).map(c=>({checklist:c,...statusCombinado(c)})).sort(ordenarCards);todosOut.innerHTML=arr.map(o=>cardHTML(o.checklist,o)).join("");}
function atualizarFooter(){footerStatus.innerText=`Painel Operacional v3.0 • ${navigator.onLine?"🟢 Online":"🔴 Offline"} • ${textoUltimaSync()}`;}
async function init(){renderizarAdmin();await carregarDados();renderTurnos();await renderizarPainel();setInterval(async()=>{await carregarDados();renderTurnos();renderizarPainel();},APP.SYNC_INTERVAL_MS);}
init();if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script></body></html>
