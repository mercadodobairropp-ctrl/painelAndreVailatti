<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Monitor de Alertas v6.8</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"></head><body><div class="container"><div class="topbar"><div class="logoArea"><img src="icon-512.png" class="logo"><div><h1>Monitor de Alertas</h1><div class="sub">Painel Operacional v6.8</div></div></div><div class="row" style="width:auto"><button class="secondary" style="width:auto;margin:0" onclick="atualizarManual()">Atualizar</button><a class="btn secondary" style="width:auto;margin:0" href="login.html">Login</a></div></div><div class="card"><h2>Empresa deste dispositivo</h2><select id="empresaMonitor" onchange="salvarEmpresaMonitor()"><option value="">Todas as empresas</option></select></div><div class="card center"><div class="kpi" id="relogio">--:--</div><div id="status">Carregando...</div></div><div id="lista"></div><div class="footerStatus" id="footerStatus">v6.8</div></div><script src="config.js"></script><script src="app.js"></script><script>
let checks=[],execs=[],empresas=[];
function nomeEmpresaLocal(id){return empresas.find(e=>e.id===id)?.nome||id||"Sem empresa"}
function empresaAtual(){return localStorage.getItem("empresaDispositivo")||""}
async function salvarEmpresaMonitor(){localStorage.setItem("empresaDispositivo",empresaMonitor.value);await atualizarManual()}
function renderSelectEmpresa(){empresaMonitor.innerHTML='<option value="">Todas as empresas</option>'+empresas.map(e=>`<option value="${e.id}">${e.nome}</option>`).join("");empresaMonitor.value=empresaAtual()}
async function carregar(force=true){const revAnterior=localStorage.getItem("syncRevision");const sync=await carregarSyncInfo();if(sync?.revision&&revAnterior&&sync.revision!==revAnterior)force=true;empresas=await carregarEmpresasOnline(force).catch(()=>obterEmpresas());checks=await carregarChecklistsOnline(force);execs=await carregarExecucoesOnline(hojeISO(),hojeISO(),force);renderSelectEmpresa();marcarSync(sync?.servidorEm);render()}
async function atualizarManual(){status.innerHTML="Atualizando...";Mem.last={usuarios:0,turnos:0,empresas:0,checklists:0,execucoes:0};await carregar(true)}
function ex(id){return execs.find(e=>e.idExecucao===id)||getExecLocal(id)}
function render(){relogio.innerText=horaBR();const dia=diaSemanaAtual(),emp=empresaAtual();const arr=checks.filter(c=>c.ativo!=="nao"&&(!emp||!c.empresaId||c.empresaId===emp)&&(!c.dias.length||c.dias.includes(dia))).map(c=>({checklist:c,idExec:execId(c),exec:ex(execId(c))})).map(o=>({...o,status:statusExecucao(o.checklist,o.exec)})).sort(ordenarCards);const pend=arr.filter(o=>["liberado","atrasado","critico","executando","reaberto","aguardando_envio"].includes(o.status));status.innerHTML=pend.length?` ${pend.length} pendência(s)`:"✓ Nenhuma pendência agora";lista.innerHTML=arr.map(o=>{disparar(o);return`<div class="card ${classeStatus(o.status)}"><h2>${o.checklist.nome}</h2><span class="badge gray">${nomeEmpresaLocal(o.checklist.empresaId)}</span><span class="badge blue">${o.checklist.horario} até ${o.checklist.horarioFim}</span><p>${textoStatus(o.status,o.checklist,o.exec)}</p></div>`}).join("");footerStatus.innerText=`Monitor v6.8 • ${navigator.onLine?" Online":" Offline"} • ${textoUltimaSync()}`}
function disparar(o){if(o.status==="liberado")alertaUnico(o.idExec,"monitor_liberado",1);if(o.status==="atrasado")alertaUnico(o.idExec,"monitor_atrasado30",3);if(o.status==="critico")alertaUnico(o.idExec,"monitor_critico1h",6,`Crítico CRÍTICO: ${o.checklist.nome} (${o.checklist.horario} até ${o.checklist.horarioFim}) está crítico.`)}
carregar(true);setInterval(()=>carregar(false),90000);setInterval(render,1000);
</script></body></html>
