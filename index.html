<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Checklist Confiança</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#d60000">

<style>

:root{
    --bg:#0f1115;
    --card:#1b1f27;
    --green:#00ff88;
    --yellow:#ffd000;
    --red:#ff3b3b;
    --text:#e6e6e6;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:linear-gradient(135deg,#0f1115,#151922);
    color:var(--text);
    font-family:Segoe UI,Arial;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:var(--green);
    margin-bottom:25px;
}

.identificacao{
    background:var(--card);
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
}

.identificacao h2{
    margin-top:0;
    color:var(--green);
}

input,select{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.card{
    background:var(--card);
    padding:18px;
    border-radius:15px;
    margin-bottom:20px;
    border-left:6px solid #555;
    transition:0.3s;
}

.card h3{
    margin-top:0;
}

.status{
    font-size:14px;
    margin-top:10px;
    font-weight:bold;
}

.status.ok{
    color:var(--green);
}

.status.wait{
    color:var(--yellow);
}

.status.delay{
    color:var(--red);
    animation:pulse 1s infinite;
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.4;
    }

    100%{
        opacity:1;
    }

}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--green);
    color:#000;
    font-weight:bold;
    font-size:16px;
    margin-top:15px;
    cursor:pointer;
}

.timer{
    margin-top:10px;
    font-size:14px;
    opacity:0.8;
}

</style>

</head>

<body>

<div class="container">

<h1>📋 Painel de Checklists</h1>

<div class="identificacao">

<h2>👤 Identificação</h2>

<input
id="nomeFuncionario"
placeholder="Nome da funcionária"
>

<select id="turnoFuncionario">

<option value="">Selecione o turno</option>

<option>Manhã</option>
<option>Tarde</option>
<option>Noite</option>

</select>

</div>

<div id="painel"></div>

</div>

<script>

const checklists = [

{
    nome:"Checklist Abertura",
    arquivo:"abertura.html",
    horario:"08:00"
},

{
    nome:"Checklist Padaria",
    arquivo:"padaria.html",
    horario:"14:00"
},

{
    nome:"Checklist Fechamento",
    arquivo:"fechamento.html",
    horario:"21:00"
}

];

function salvarFuncionario(){

    const nome =
        document.getElementById(
            "nomeFuncionario"
        ).value;

    const turno =
        document.getElementById(
            "turnoFuncionario"
        ).value;

    localStorage.setItem(
        "funcionario_nome",
        nome
    );

    localStorage.setItem(
        "funcionario_turno",
        turno
    );

}

function abrirChecklist(arquivo){

    salvarFuncionario();

    const nome =
        localStorage.getItem(
            "funcionario_nome"
        );

    const turno =
        localStorage.getItem(
            "funcionario_turno"
        );

    if(!nome){

        alert("Informe o nome da funcionária.");

        return;

    }

    if(!turno){

        alert("Selecione o turno.");

        return;

    }

    window.location.href = arquivo;

}

function gerarPainel(){

    const painel =
        document.getElementById("painel");

    painel.innerHTML = "";

    const agora = new Date();

    const horaAtual =
        agora.getHours() * 60 +
        agora.getMinutes();

    checklists.forEach(c=>{

        const partes =
            c.horario.split(":");

        const horarioMin =
            parseInt(partes[0]) * 60 +
            parseInt(partes[1]);

        let status = "";
        let classe = "";

        if(horaAtual < horarioMin){

            status = "⏳ Aguardando horário";
            classe = "wait";

        }else{

            status = "🚨 Checklist pendente";
            classe = "delay";

        }

        const restante =
            horarioMin - horaAtual;

        let textoTimer = "";

        if(restante > 0){

            const horas =
                Math.floor(restante / 60);

            const minutos =
                restante % 60;

            textoTimer =
                `Libera em ${horas}h ${minutos}min`;

        }

        painel.innerHTML += `

        <div class="card">

            <h3>${c.nome}</h3>

            <div>
            🕒 Horário: ${c.horario}
            </div>

            <div class="status ${classe}">
            ${status}
            </div>

            <div class="timer">
            ${textoTimer}
            </div>

            <button onclick="abrirChecklist('${c.arquivo}')">
            Abrir Checklist
            </button>

        </div>

        `;

    });

}

gerarPainel();

setInterval(
    gerarPainel,
    60000
);

</script>

</body>

</html>
