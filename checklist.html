<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checklist</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<div class="container"><div class="topbar"><div class="logoArea"><img src="icon-512.png" class="logo"><div><h1 id="titulo">Checklist</h1><div class="sub" id="subtitulo"></div></div></div><button class="red" style="width:auto;margin:0" onclick="cancelarExecucao()">Cancelar execução</button></div><div class="card"><div><b>Responsável:</b> <span id="responsavel"></span></div><div><b>Início:</b> <span id="inicio"></span></div><div><b>Término:</b> <span id="fim">--:--</span></div></div><div id="tarefas"></div><button onclick="finalizar()">✅ Finalizar e enviar PDF</button></div>
<div class="modal" id="cameraModal"><div class="modalContent"><h2>📷 Câmera</h2><video id="video" autoplay playsinline></video><div class="row"><button onclick="capturarFoto()">Capturar</button><button class="secondary" onclick="fecharCamera()">Cancelar</button></div></div></div>
<div class="modal" id="envioModal"><div class="modalContent progressModal"><h2 id="envioTitulo">Gerando PDF</h2><p id="envioTexto">Preparando arquivo e enviando para o Drive...</p><div class="progressTrack"><div id="envioBarra" class="progressBar" style="width:0%"></div></div><div id="envioPct" class="progressPct">0%</div></div></div>
<div class="modal" id="avisoModal"><div class="modalContent confirmModal"><h2 id="avisoTitulo">Atenção</h2><p id="avisoTexto"></p><button id="avisoOk" type="button">OK</button></div></div>
<script src="config.js?v=6.10-layout-20260615"></script><script src="app.js?v=6.10-layout-20260615"></script><script>
history.pushState(null,null,location.href);window.onpopstate=function(){history.pushState(null,null,location.href);mostrarAviso("Ação bloqueada","Use o botão Cancelar execução para sair.")};
const usuario=exigirLogin(),params=new URLSearchParams(location.search),id=params.get("id"),idExec=params.get("exec");let checklist=null,inicio=new Date(),fotoAtualIndex=null,stream=null,envioTimer=null,envioProgresso=0;
async function iniciar(){const lista=await obterChecklists();checklist=lista.find(c=>c.id===id);if(!checklist){await mostrarAviso("Checklist não encontrado","Volte ao painel e tente abrir novamente.");location.href="painel.html";return}let execAtual=getExecLocal(idExec);if(!execAtual){const online=await carregarExecucoesOnline(hojeISO(),hojeISO(),true);execAtual=online.find(e=>e.idExecucao===idExec)||null}const st=statusExecucao(checklist,execAtual);if(["expirado","finalizado","aguardando"].includes(st)){await mostrarAviso("Checklist indisponível","Este checklist não está disponível para execução agora.");location.href="painel.html";return}document.title=checklist.nome;titulo.innerText=checklist.nome;subtitulo.innerText=`${checklist.descricao} • ${checklist.horario} até ${checklist.horarioFim}`;responsavel.innerText=`${usuario.nome} (${usuario.login})`;document.getElementById("inicio").innerText=horaBR();montar()}
function montar(){tarefas.innerHTML=checklist.tarefas.map((t,i)=>`<div class="task" id="task${i}"><div class="taskHeader"><input type="checkbox" id="c${i}"><div>${t}</div></div><textarea id="obs${i}" placeholder="Observações..."></textarea><button class="secondary" onclick="abrirCamera(${i})">📷 Tirar foto agora</button><div id="fotoBox${i}"></div></div>`).join("");desativarSugestoesCampos(tarefas)}
async function abrirCamera(i){fotoAtualIndex=i;cameraModal.style.display="flex";try{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}},audio:false})}catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}video.srcObject=stream}catch(err){fecharCamera();await mostrarAviso("Câmera indisponível","Não foi possível abrir a câmera. Verifique a permissão do navegador.",document.getElementById("task"+i))}}
function fecharCamera(){cameraModal.style.display="none";if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function capturarFoto(){const canvas=document.createElement("canvas"),maxW=800,ratio=video.videoHeight/video.videoWidth||1;canvas.width=maxW;canvas.height=Math.round(maxW*ratio);canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);const img=document.createElement("img");img.src=canvas.toDataURL("image/jpeg",0.55);img.className="previewImg";img.id="foto"+fotoAtualIndex;const box=document.getElementById("fotoBox"+fotoAtualIndex);box.innerHTML="";box.appendChild(img);fecharCamera()}
function addWrapped(pdf,text,x,y,w,h){const lines=pdf.splitTextToSize(String(text||""),w);pdf.text(lines,x,y);return y+lines.length*h}
function ensurePage(pdf,y,n){if(y+n>275){pdf.addPage();return 18}return y}
function atualizarProgresso(v,titulo,texto){envioProgresso=Math.max(envioProgresso,Math.min(100,Math.round(v)));envioBarra.style.width=envioProgresso+"%";envioPct.innerText=envioProgresso+"%";if(titulo)envioTitulo.innerText=titulo;if(texto)envioTexto.innerText=texto}
function abrirProgresso(){envioModal.style.display="flex";envioProgresso=0;atualizarProgresso(0,"Gerando PDF","Preparando arquivo e enviando para o Drive...");envioTimer=setInterval(()=>{if(envioProgresso<88)atualizarProgresso(envioProgresso+1)},450)}
function concluirProgresso(titulo,texto){clearInterval(envioTimer);atualizarProgresso(100,titulo,texto)}
function rolarParaPendencia(el){if(!el)return;document.querySelectorAll(".pendenteFoco").forEach(x=>x.classList.remove("pendenteFoco"));el.classList.add("pendenteFoco");el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.classList.remove("pendenteFoco"),3500)}
function mostrarAviso(titulo,texto,el=null){return new Promise(resolve=>{avisoTitulo.innerText=titulo||"Atenção";avisoTexto.innerText=texto||"";avisoModal.style.display="flex";avisoOk.onclick=()=>{avisoModal.style.display="none";avisoOk.onclick=null;setTimeout(()=>rolarParaPendencia(el),80);resolve()}})}
async function gerarPDF(){const{jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");let y=14;pdf.setFillColor(214,0,0);pdf.rect(0,0,210,24,"F");pdf.setTextColor(255,255,255);pdf.setFontSize(16);pdf.text("CHECKLIST CONFIANÇA",10,10);pdf.setFontSize(11);pdf.text(checklist.nome,10,18);y=34;pdf.setTextColor(0,0,0);pdf.setFontSize(10);y=addWrapped(pdf,`Responsável: ${usuario.nome} | Login: ${usuario.login}`,10,y,185,5);y=addWrapped(pdf,`Data: ${dataBR()} | Início: ${horaBR(inicio)} | Término: ${horaBR()}`,10,y+1,185,5);y=addWrapped(pdf,`ID execução: ${idExec}`,10,y+1,185,5);y+=4;checklist.tarefas.forEach((t,i)=>{y=ensurePage(pdf,y,70);pdf.setFillColor(245,245,245);pdf.roundedRect(8,y-5,194,10,2,2,"F");pdf.setTextColor(0,0,0);pdf.setFontSize(11);y=addWrapped(pdf,`${i+1}. ${t}`,10,y+1,185,5);const obs=document.getElementById("obs"+i).value||"Sem observações";pdf.setFontSize(9);pdf.setTextColor(80,80,80);y=addWrapped(pdf,`Observação: ${obs}`,10,y+2,185,4.5);const img=document.getElementById("foto"+i);if(img){y=ensurePage(pdf,y,45);try{pdf.addImage(img.src,"JPEG",10,y+2,55,42)}catch(e){}y+=48}else y+=4});return pdf.output("blob")}
async function cancelarExecucao(){if(!await confirmarAcao({titulo:"Cancelar execução",texto:"Cancelar esta execução e liberar para outro colaborador?",confirmar:"Cancelar execução",perigo:true}))return;removeExecLocal(idExec);await postAPI({acao:"log",tipo:"cancelou",login:usuario.login,nomeUsuario:usuario.nome,idChecklist:checklist.id,nomeChecklist:checklist.nome,detalhe:"Cancelou "+idExec});location.href="painel.html"}
async function finalizar(){for(let i=0;i<checklist.tarefas.length;i++){const task=document.getElementById("task"+i);if(!document.getElementById("c"+i).checked){await mostrarAviso("Atividade pendente","Falta marcar a atividade:\n"+checklist.tarefas[i],task);return}if(!document.getElementById("foto"+i)){await mostrarAviso("Foto pendente","Falta tirar foto na atividade:\n"+checklist.tarefas[i],task);return}}const st=statusExecucao(checklist,getExecLocal(idExec));if(st==="expirado"){await mostrarAviso("Checklist expirado","Não é mais possível finalizar este checklist.");location.href="painel.html";return}fim.innerText=horaBR();abrirProgresso();atualizarProgresso(12,"Gerando PDF","Montando o arquivo com tarefas, observações e fotos...");const blob=await gerarPDF();atualizarProgresso(45,"Preparando envio","Convertendo PDF para envio ao Drive...");const reader=new FileReader();reader.onloadend=async function(){const base64=reader.result.split(",")[1],nome=nomePdf(checklist);const payload={acao:"finalizarExecucao",idExecucao:idExec,data:hojeISO(),idChecklist:checklist.id,nomeChecklist:checklist.nome,horario:checklist.horario,horarioFim:checklist.horarioFim,status:"finalizado",login:usuario.login,nomeUsuario:usuario.nome,turno:localStorage.getItem("turnoSelecionado")||"",nomeArquivo:nome,base64};try{atualizarProgresso(72,"Enviando para o Drive","Aguarde enquanto o arquivo é salvo na nuvem...");const r=await postAPI(payload,45000);setExecLocal(idExec,{...payload,status:"finalizado",urlPDF:"",confirmacaoPendente:!!r?.timeout});concluirProgresso(r?.timeout?"Checklist enviado":"Checklist enviado",r?.timeout?"Envio concluído no aparelho. Se o link do PDF demorar a aparecer, atualize o painel gerencial.":"PDF gerado e enviado para o Drive.")}catch(e){await enfileirarEnvio(payload);setExecLocal(idExec,{...payload,status:"aguardando_envio"});concluirProgresso("Salvo para envio","Sem internet agora. O PDF será enviado automaticamente.")}setTimeout(()=>{location.href="painel.html"},1600)};reader.readAsDataURL(blob)}
iniciar();
</script></body></html>
