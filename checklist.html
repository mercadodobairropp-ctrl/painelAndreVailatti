<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
    <div class="topbar">
        <div class="logoArea">
            <img src="icon-512.png" class="logo">
            <div>
                <h1 id="titulo">Checklist</h1>
                <div class="sub" id="subtitulo"></div>
            </div>
        </div>
        <button class="secondary" style="width:auto;margin:0" onclick="voltar()">Voltar</button>
    </div>

    <div class="card">
        <div><b>Responsável:</b> <span id="responsavel"></span></div>
        <div><b>Início:</b> <span id="inicio"></span></div>
        <div><b>Término:</b> <span id="fim">--:--</span></div>
        <div class="small">As fotos são capturadas pela câmera dentro do app.</div>
    </div>

    <div id="tarefas"></div>

    <button onclick="finalizar()">✅ Finalizar e enviar PDF</button>
</div>

<div class="modal" id="cameraModal">
    <div class="modalContent">
        <h2>📷 Câmera</h2>
        <video id="video" autoplay playsinline></video>
        <div class="row">
            <button onclick="capturarFoto()">Capturar</button>
            <button class="secondary" onclick="fecharCamera()">Cancelar</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const usuario = exigirLogin();
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
let checklist = null;
let inicio = new Date();
let fotoAtualIndex = null;
let stream = null;

async function iniciar(){
    const lista = await obterChecklists();
    checklist = lista.find(c=>c.id===id);
    if(!checklist){ alert("Checklist não encontrado."); window.location.href="painel.html"; return; }

    document.title = checklist.nome;
    document.getElementById("titulo").innerText = checklist.nome;
    document.getElementById("subtitulo").innerText = checklist.descricao + " • " + checklist.horario;
    document.getElementById("responsavel").innerText = `${usuario.nome} (${usuario.login})`;
    document.getElementById("inicio").innerText = horaBR();

    montar();
}

function voltar(){ window.location.href = "painel.html"; }

function montar(){
    const div = document.getElementById("tarefas");
    div.innerHTML = checklist.tarefas.map((t,i)=>`
        <div class="task">
            <div class="taskHeader">
                <input type="checkbox" id="c${i}">
                <div>${t}</div>
            </div>
            <textarea id="obs${i}" placeholder="Observações..."></textarea>
            <button class="secondary" onclick="abrirCamera(${i})">📷 Tirar foto agora</button>
            <div id="fotoBox${i}"></div>
        </div>
    `).join("");
}
async function abrirCamera(i){
    fotoAtualIndex = i;
    document.getElementById("cameraModal").style.display = "flex";
    try{
        stream = await navigator.mediaDevices.getUserMedia({
            video:{facingMode:{ideal:"environment"}},
            audio:false
        });
        document.getElementById("video").srcObject = stream;
    }catch(e){
        alert("Não foi possível abrir a câmera. Verifique a permissão do navegador.");
        fecharCamera();
    }
}
function fecharCamera(){
    document.getElementById("cameraModal").style.display = "none";
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
}
function capturarFoto(){
    const video = document.getElementById("video");
    const canvas = document.createElement("canvas");
    const maxW = 800;
    const ratio = video.videoHeight / video.videoWidth;
    canvas.width = maxW;
    canvas.height = Math.round(maxW * ratio);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const data = canvas.toDataURL("image/jpeg",0.55);
    const img = document.createElement("img");
    img.src = data;
    img.className = "previewImg";
    img.id = "foto"+fotoAtualIndex;
    const box = document.getElementById("fotoBox"+fotoAtualIndex);
    box.innerHTML = "";
    box.appendChild(img);
    fecharCamera();
}
function addWrapped(pdf, text, x, y, maxWidth, lineHeight){
    const lines = pdf.splitTextToSize(String(text || ""), maxWidth);
    pdf.text(lines, x, y);
    return y + (lines.length * lineHeight);
}
function ensurePage(pdf, y, needed){
    if(y + needed > 275){
        pdf.addPage();
        return 18;
    }
    return y;
}
async function gerarPDF(){
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","mm","a4");
    let y = 14;

    pdf.setFillColor(214,0,0);
    pdf.rect(0,0,210,24,"F");
    pdf.setTextColor(255,255,255);
    pdf.setFontSize(16);
    pdf.text("CHECKLIST CONFIANÇA", 10, 10);
    pdf.setFontSize(11);
    pdf.text(checklist.nome, 10, 18);

    y = 34;
    pdf.setTextColor(0,0,0);
    pdf.setFontSize(10);
    y = addWrapped(pdf, `Responsável: ${usuario.nome} | Login: ${usuario.login}`, 10, y, 185, 5);
    y = addWrapped(pdf, `Data: ${dataBR()} | Início: ${horaBR(inicio)} | Término: ${horaBR()}`, 10, y+1, 185, 5);
    y = addWrapped(pdf, `ID: ${checklist.id}-${hojeISO()}-${usuario.login}-${Date.now()}`, 10, y+1, 185, 5);
    y += 4;

    checklist.tarefas.forEach((t,i)=>{
        y = ensurePage(pdf,y,70);
        pdf.setFillColor(245,245,245);
        pdf.roundedRect(8,y-5,194,10,2,2,"F");
        pdf.setTextColor(0,0,0);
        pdf.setFontSize(11);
        y = addWrapped(pdf, `${i+1}. ${t}`, 10, y+1, 185, 5);
        const obs = document.getElementById("obs"+i).value || "Sem observações";
        pdf.setFontSize(9);
        pdf.setTextColor(80,80,80);
        y = addWrapped(pdf, `Observação: ${obs}`, 10, y+2, 185, 4.5);
        const img = document.getElementById("foto"+i);
        if(img){
            y = ensurePage(pdf,y,45);
            try{
                pdf.addImage(img.src, "JPEG", 10, y+2, 55, 42);
            }catch(e){}
            y += 48;
        } else {
            y += 4;
        }
    });

    const total = pdf.getNumberOfPages();
    for(let p=1;p<=total;p++){
        pdf.setPage(p);
        pdf.setFontSize(8);
        pdf.setTextColor(120,120,120);
        pdf.text(`Página ${p} de ${total}`, 170, 290);
    }

    return pdf.output("blob");
}
async function finalizar(){
    for(let i=0;i<checklist.tarefas.length;i++){
        if(!document.getElementById("c"+i).checked){
            alert("Falta marcar: " + checklist.tarefas[i]);
            return;
        }
        if(!document.getElementById("foto"+i)){
            alert("Falta foto em: " + checklist.tarefas[i]);
            return;
        }
    }
    document.getElementById("fim").innerText = horaBR();
    alert("Gerando PDF...");
    const blob = await gerarPDF();
    const reader = new FileReader();
    reader.onloadend = async function(){
        const base64 = reader.result.split(",")[1];
        const nome = nomePdf(checklist);
        await postAPI({acao:"uploadPdf", nome, base64});
        setConcluido(checklist.id, usuario);
        const hist = JSON.parse(localStorage.getItem("historicoLocal") || "[]");
        hist.push({login:usuario.login,nome:usuario.nome,checklist:checklist.nome,data:dataBR(),hora:horaBR(),arquivo:nome});
        localStorage.setItem("historicoLocal", JSON.stringify(hist));
        alert("✅ Checklist finalizado e PDF enviado.");
        window.location.href = "painel.html";
    };
    reader.readAsDataURL(blob);
}
iniciar();
</script>
</body>
</html>
